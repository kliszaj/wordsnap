services:
  wordsnap:
    build:
      context: ./backend
    image: ${WORDSNAP_IMAGE:-kliszaj/wordsnap:latest}
    container_name: wordsnap-build
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
