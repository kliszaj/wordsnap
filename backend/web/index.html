<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordSnap Hoth</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Hoth receiver</p>
          <h1>Review ledger</h1>
        </div>
        <div class="metric-strip" aria-label="Dashboard metrics">
          <div class="metric">
            <span id="metric-total">00</span>
            <label>clips</label>
          </div>
          <div class="metric">
            <span id="metric-review">00</span>
            <label>review</label>
          </div>
          <div class="metric">
            <span id="metric-approved">00</span>
            <label>approved</label>
          </div>
          <div class="metric">
            <span id="pending-count">[00]</span>
            <label>pending</label>
          </div>
        </div>
        <div class="toolbar-actions">
          <button id="refresh-button" class="ghost-button" type="button">Refresh</button>
          <a class="ghost-button" href="/assets/directions.html">UI directions</a>
          <label class="file-button">
            Upload WAV
            <input id="file-input" type="file" accept="audio/wav,.wav" multiple />
          </label>
          <a class="ghost-button strong" href="/api/export/anki.csv">Export CSV</a>
        </div>
      </header>

      <section class="review-board" aria-label="Clip review ledger">
        <div class="workbench">
          <aside class="clip-queue" aria-label="Clip queue">
            <div class="queue-head">
              <span>clip</span>
              <span>status</span>
            </div>
            <div id="clip-queue-list" class="clip-queue-list" aria-live="polite"></div>
          </aside>
          <section id="clip-detail" class="clip-detail" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <template id="queue-template">
      <button class="queue-item" type="button">
        <span class="queue-number"></span>
        <span>
          <strong class="queue-title"></strong>
          <small class="queue-meta"></small>
        </span>
        <span class="status"></span>
      </button>
    </template>

    <template id="detail-template">
      <article class="clip">
        <div class="clip-top">
          <div>
            <p class="eyebrow">Selected clip</p>
            <div class="clip-title"></div>
            <div class="clip-meta"></div>
          </div>
          <span class="status"></span>
        </div>

        <div class="playback-strip">
          <audio class="audio" controls preload="none"></audio>
        </div>

        <div class="paper-pipeline" aria-label="Paper tape pipeline">
          <section class="tape-card">
            <div class="card-head">
              <span class="stage-number">01</span>
              <div>
                <h3>Transcription</h3>
              </div>
            </div>
            <label>
              Transcript correction
              <textarea class="transcript" rows="7"></textarea>
            </label>
            <label>
              Corrected word
              <input class="corrected-word" />
            </label>
            <button class="save" type="button">Save transcript</button>
          </section>

          <section class="tape-card">
            <div class="card-head">
              <span class="stage-number">02</span>
              <div>
                <h3>Translation</h3>
              </div>
            </div>
            <label>
              Swedish explanation
              <textarea class="swedish-definition" rows="7"></textarea>
            </label>
            <label>
              English word
              <input class="english-definition" />
            </label>
            <button class="process" type="button">Reprocess with Claude</button>
          </section>

          <section class="tape-card">
            <div class="card-head">
              <span class="stage-number">03</span>
              <div>
                <h3>Anki library</h3>
              </div>
            </div>
            <div class="anki-preview" aria-label="Anki preview">
              <div class="front"></div>
              <div class="back"></div>
            </div>
            <button class="approve" type="button">Approve card</button>
          </section>
        </div>
        <p class="error"></p>
      </article>
    </template>

    <script src="/assets/app.js"></script>
  </body>
</html>
