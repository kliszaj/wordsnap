<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wordsnap</title>
    <link rel="stylesheet" href="/assets/styles.css?v=20260709-7" />
  </head>
  <body>
    <main class="shell">
      <header class="app-header">
        <div>
          <h1>wordsnap</h1>
        </div>
        <div class="toolbar-actions">
          <label class="auto-sync" title="Auto-save new snips to Anki and sync to your phone">
            <input type="checkbox" id="auto-sync-input" checked />
            <span class="auto-sync-track" aria-hidden="true"><span class="auto-sync-thumb"></span></span>
            <span class="auto-sync-text">Auto-sync</span>
          </label>
          <button type="button" class="ghost-button" id="settings-open">Settings</button>
        </div>
      </header>

      <section class="review-board" aria-label="Snip review ledger">
        <div class="workbench">
          <aside class="clip-queue" aria-label="Snip queue">
            <div class="queue-head">
              <span>snip</span>
            </div>
            <div id="clip-queue-list" class="clip-queue-list" aria-live="polite"></div>
          </aside>
          <section id="clip-detail" class="clip-detail" aria-live="polite"></section>
        </div>
      </section>
    </main>

    <dialog id="settings-dialog" class="settings-dialog">
      <form id="settings-form" method="dialog">
        <div class="settings-head">
          <div>
            <p class="eyebrow">Server settings</p>
            <h2 class="settings-title">Credentials</h2>
          </div>
          <button type="button" class="ghost-button" id="settings-close">Close</button>
        </div>
        <p class="settings-note">
          Stored on the server in appdata, not baked into the image. Leave a field blank to keep its
          current value. Keys are never shown back — only a masked hint.
        </p>

        <fieldset class="settings-group">
          <legend>LLM API keys</legend>
          <label class="settings-field">
            <span class="settings-label">Anthropic API key <em class="settings-status" id="status-anthropic"></em></span>
            <input type="password" id="input-anthropic" autocomplete="off" spellcheck="false" placeholder="sk-ant-..." />
          </label>
          <label class="settings-field">
            <span class="settings-label">OpenAI API key <em class="settings-status" id="status-openai"></em></span>
            <input type="password" id="input-openai" autocomplete="off" spellcheck="false" placeholder="sk-..." />
          </label>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Models (optional overrides)</legend>
          <label class="settings-field">
            <span class="settings-label">LLM provider</span>
            <select id="input-llm-provider">
              <option value="anthropic">Anthropic first, OpenAI fallback</option>
              <option value="openai">OpenAI first, Anthropic fallback</option>
            </select>
          </label>
          <label class="settings-field">
            <span class="settings-label">Claude model</span>
            <input type="text" id="input-claude-model" autocomplete="off" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span class="settings-label">Whisper model</span>
            <input type="text" id="input-whisper-model" autocomplete="off" spellcheck="false" />
          </label>
          <label class="settings-field">
            <span class="settings-label">GPT model (lab compare)</span>
            <input type="text" id="input-gpt-model" autocomplete="off" spellcheck="false" />
          </label>
        </fieldset>

        <fieldset class="settings-group">
          <legend>Anki destination</legend>
          <label class="settings-field">
            <span class="settings-label">AnkiConnect URL <em class="settings-status" id="status-anki-connect"></em></span>
            <input type="url" id="input-anki-connect-url" autocomplete="off" spellcheck="false" placeholder="http://10.0.0.x:8765" />
          </label>
          <label class="settings-field">
            <span class="settings-label">Deck name <em class="settings-status" id="status-anki-deck"></em></span>
            <input type="text" id="input-anki-deck" autocomplete="off" spellcheck="false" placeholder="Default" />
          </label>
          <div class="settings-field">
            <span class="settings-label">Last Anki save <em class="settings-status" id="status-anki-last-save"></em></span>
          </div>
        </fieldset>

        <div class="settings-actions">
          <span class="settings-msg" id="settings-msg" aria-live="polite"></span>
          <button type="button" class="ghost-button strong" id="settings-save">Save</button>
        </div>
      </form>
    </dialog>

    <template id="queue-template">
      <div class="queue-row">
        <button class="queue-play" type="button" aria-label="Play snip">
          <span class="queue-play-icon" aria-hidden="true"></span>
        </button>
        <button class="queue-item" type="button">
          <span class="queue-copy">
            <strong class="queue-title"></strong>
            <small class="queue-meta"></small>
          </span>
        </button>
        <button class="queue-delete" type="button" aria-label="Delete snip">
          <span aria-hidden="true"></span>
        </button>
      </div>
    </template>

    <template id="detail-template">
      <article class="clip">
        <div class="clip-top">
          <div>
            <p class="eyebrow">Selected snip</p>
            <div class="clip-title"></div>
            <div class="clip-meta"></div>
          </div>
          <span class="status"></span>
        </div>

        <div class="playback-strip">
          <audio class="audio" controls preload="none"></audio>
        </div>

        <div class="paper-pipeline" aria-label="Paper tape pipeline">
          <section class="tape-card">
            <div class="card-head">
              <span class="stage-number">01</span>
              <h3>transcription</h3>
            </div>
            <label>
              Transcript correction
              <textarea class="transcript" rows="7"></textarea>
            </label>
            <label>
              Swedish item
              <input class="card-front" />
            </label>
          </section>

          <button class="pipeline-sync" type="button">Sync</button>

          <section class="tape-card">
            <div class="card-head">
              <span class="stage-number">02</span>
              <h3>anki</h3>
            </div>
            <div class="anki-preview" aria-label="Anki preview">
              <div class="preview-field">
                <span>Card front</span>
                <div class="front"></div>
              </div>
              <div class="preview-field">
                <span>Card back</span>
                <div class="back"></div>
              </div>
            </div>
          </section>
        </div>
        <p class="error"></p>
      </article>
    </template>

    <script src="/assets/app.js?v=20260709-7"></script>
  </body>
</html>
